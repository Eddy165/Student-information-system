services:
  sis:
    build: .
    environment:
      SIS_ENV: demo
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sis_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sis_data:
