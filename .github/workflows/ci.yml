name: SIS CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sis_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Unit and integration tests
        env:
          SIS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sis_test
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q .
      - name: Lint
        run: ruff check app.py sis tests
