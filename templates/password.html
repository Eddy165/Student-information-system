{% extends 'base.html' %}{% block heading %}Change password{% endblock %}{% block content %}<section class="panel account-panel"><h2>Change password</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label><p class="muted">Use at least 12 characters. You will need to sign in again.</p><button class="primary">Update password</button></form></section>{% endblock %}
